apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-debugger
  namespace: team-api
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debuggers-can-exec
  namespace: team-api
subjects:
  - kind: Group
    name: debuggers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pod-debugger
  apiGroup: rbac.authorization.k8s.io